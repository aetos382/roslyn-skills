name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate the plugin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      # The repository root holds the marketplace manifest; the plugin manifest and its skills live
      # under plugin/, so both paths have to be validated separately.
      - name: Validate the marketplace manifest
        run: claude plugin validate . --strict

      - name: Validate the plugin manifest and skills
        run: claude plugin validate ./plugin --strict

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # There is no solution file, so the test project is named explicitly. Locked mode fails the
      # restore instead of silently updating packages.lock.json when a package reference has moved.
      - name: Test
        run: dotnet test tests/RoslynSkills.AddDiagnostic.Scripts.Tests/RoslynSkills.AddDiagnostic.Scripts.Tests.csproj -p:RestoreLockedMode=true
