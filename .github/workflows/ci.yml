name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate the plugin
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      # The repository root holds the marketplace manifest; the plugin manifest and its skills live
      # under plugin/, so both paths have to be validated separately.
      - name: Validate the marketplace manifest
        run: claude plugin validate . --strict

      - name: Validate the plugin manifest and skills
        run: claude plugin validate ./plugin --strict

  test:
    name: Test
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK comes from global.json, which pins a version with rollForward disabled; a floating
      # dotnet-version would install a patch that pin then rejects.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Test
        run: >-
          dotnet test RoslynSkills.slnx
          --configuration Release
          --report-gh

      # The package is what the skill actually invokes, so a break in packaging has to fail here rather
      # than at release time.
      - name: Pack
        run: >-
          dotnet pack src/Aetos.RoslynSkills.Tools/Aetos.RoslynSkills.Tools.csproj
          --configuration Release
          --output artifacts

      # Exercising the package the way the skill does catches what a build cannot: a missing dependency in
      # the tool bundle, or a subcommand that no longer starts. Spelled out as the skill spells it: dnx is
      # the same command, but as a script it is not resolvable from Bash on Windows.
      - name: Run the packed tool
        run: |
          version=$(ls artifacts/Aetos.RoslynSkills.Tools.*.nupkg | sed -E 's/.*\.Tools\.(.+)\.nupkg$/\1/')
          dotnet tool exec --source ./artifacts "Aetos.RoslynSkills.Tools@$version" -- add-diagnostic find-conventions --path . --summary > /dev/null
