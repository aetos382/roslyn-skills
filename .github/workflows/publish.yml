name: Publish to NuGet.org

# The trusted publishing policy on nuget.org names this file, so renaming it breaks the OIDC exchange.
on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-slim
    environment: publish

    permissions:
      id-token: write # the OIDC token NuGet/login exchanges for a short-lived API key
      contents: read

    steps:
      # Nothing is rebuilt here: what reaches NuGet.org is the asset release.yml attached and a human then
      # approved by publishing the release. The pattern carries no dot so it takes the .snupkg as well.
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release download "${{ github.event.release.tag_name }}"
          --repo "${{ github.repository }}"
          --pattern "*nupkg"
          --dir artifacts

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Trusted publishing: no API key is stored anywhere. NUGET_USER is the nuget.org profile name.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # push finds the .snupkg next to the .nupkg and sends the symbols with it.
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
